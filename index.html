<!doctype html><n<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#100d25"><title>BALLS 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100d25;color:white;font-family:system-ui}canvas{width:100%;height:100%;display:block}.hud{position:fixed;inset:0;pointer-events:none;padding:18px 16px;display:flex;flex-direction:column;justify-content:space-between}.top,.bottom{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{font-weight:900;letter-spacing:3px;font-size:21px}.sub{font-size:10px;color:#c8c3e8;letter-spacing:1.5px}.pill,button{border:1px solid #ffffff45;background:#211c40cc;color:white;border-radius:22px;padding:10px 14px;font-weight:700}.bottom{justify-content:center;pointer-events:auto;flex-wrap:wrap}button.primary{background:linear-gradient(135deg,#8b5cf6,#4f46e5);border:0}.note{text-align:center;color:#d4ccef;font-size:12px;margin-bottom:12px}
</style></head><body><canvas id="c"></canvas><div class="hud"><div class="top"><div><div class="brand">BALLS 3D</div><div class="sub">IDLE PHYSICS SIMULATION</div></div><div class="pill" id="round">ROUND 01</div></div><div><div class="note" id="msg">Watch the balls build the shape</div><div class="bottom"><button class="primary" id="new">↻ NEW SHAPE</button><button id="snd">♪ SOUND ON</button><button id="pause">Ⅱ PAUSE</button></div></div></div>
<script>
(()=>{const c=document.getElementById('c'),x=c.getContext('2d');let w,h,dpr,balls=[],sparks=[],round=1,paused=false,sound=true,ac=null,t=0,last=0,joined=0,shape=0,py;
const colors=['#f7c7ff','#9de8ff','#ffd28a','#b8ffa8','#ff9eae'];
function size(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*dpr;c.height=h*dpr;x.setTransform(dpr,0,0,dpr,0,0);py=h*.73;reset(false)}
function beep(f=180,d=.06){if(!sound)return;try{ac ||= new (AudioContext||webkitAudioContext)();if(ac.state==='suspended')ac.resume();let o=ac.createOscillator(),g=ac.createGain();o.frequency.value=f;g.gain.setValueAtTime(.025,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+d)}catch(e){}}
function reset(add=true){if(add)round++;joined=0;t=0;shape=Math.floor(Math.random()*5);balls=[];let cols=9,rows=8,sp=Math.min(w/(cols+2),23);for(let r=0;r<rows;r++)for(let q=0;q<cols;q++)balls.push({x:w/2+(q-4)*sp+(Math.random()-.5)*2,y:h*.16+r*sp*.88,vx:0,vy:0,r:Math.max(4,sp*.22),color:colors[(r+q)%5],done:false});document.getElementById('round').textContent='ROUND '+String(round).padStart(2,'0');document.getElementById('msg').textContent='Watch the balls build the shape'}
function target(i){let a=i/balls.length*Math.PI*2,s=Math.min(w,h)*.13;switch(shape){case 0:return{x:w/2+Math.cos(a)*s*.7,y:py-115+Math.sin(a)*s*.55};case 1:return{x:w/2+(i%9-4)*s/5,y:py-155+Math.abs(i%9-4)*s*.4};case 2:return{x:w/2+Math.cos(a)*s*.7,y:py-120+Math.sin(a)*s*.7};case 3:return{x:w/2+(i%8-3.5)*s/4,y:py-165+Math.floor(i/8)*s/5};default:return{x:w/2+Math.cos(a)*s*(i%2?1:.5),y:py-125+Math.sin(a)*s*.7}}}
function ball(b){let g=x.createRadialGradient(b.x-b.r*.35,b.y-b.r*.4,1,b.x,b.y,b.r*1.4);g.addColorStop(0,'white');g.addColorStop(.25,b.color);g.addColorStop(1,'#29233e');x.fillStyle=g;x.beginPath();x.arc(b.x,b.y,b.r,0,7);x.fill();x.strokeStyle='#ffffff66';x.stroke()}
function draw(){let g=x.createLinearGradient(0,0,0,h);g.addColorStop(0,'#171033');g.addColorStop(.6,'#30205a');g.addColorStop(1,'#0c0a1c');x.fillStyle=g;x.fillRect(0,0,w,h);for(let i=0;i<36;i++){x.fillStyle='#ffffff38';x.fillRect(i*137%w,i*83%(h*.65),1,1)}
let cx=w/2,cy=py-125,s=Math.min(w,h)*.13;x.save();x.translate(cx,cy);x.rotate(Math.sin(t*.3)*.05);x.strokeStyle='#d8c7ff';x.lineWidth=2;x.shadowColor='#a78bfa';x.shadowBlur=20;x.fillStyle='#8b5cf622';x.beginPath();if(shape===0)x.arc(0,0,s*.7,0,7);else if(shape===1){x.moveTo(0,-s);x.lineTo(s*.85,s*.65);x.lineTo(-s*.85,s*.65);x.closePath()}else if(shape===2)x.rect(-s*.65,-s*.65,s*1.3,s*1.3);else if(shape===3){for(let i=0;i<6;i++){let a=i*Math.PI/3;x.lineTo(Math.cos(a)*s*.8,Math.sin(a)*s*.8)}x.closePath()}else{x.moveTo(0,-s);x.lineTo(s*.8,0);x.lineTo(0,s);x.lineTo(-s*.8,0);x.closePath()}x.fill();x.stroke();x.restore();
x.save();x.shadowColor='#a78bfa';x.shadowBlur=24;let p=x.createLinearGradient(0,py-8,0,py+25);p.addColorStop(0,'#77718d');p.addColorStop(.3,'#252338');p.addColorStop(1,'#080812');x.fillStyle=p;x.beginPath();x.moveTo(w*.08,py);x.lineTo(w*.92,py);x.lineTo(w*.84,py+25);x.lineTo(w*.16,py+25);x.closePath();x.fill();x.strokeStyle='#c5b6ff';x.stroke();x.restore();
balls.forEach(ball);sparks.forEach(a=>{x.globalAlpha=a.life/25;x.fillStyle=a.color;x.fillRect(a.x,a.y,3,3)});x.globalAlpha=1;let pct=joined/balls.length;x.fillStyle='#ffffff25';x.fillRect(w*.22,h*.095,w*.56,4);x.fillStyle='#c4b5fd';x.fillRect(w*.22,h*.095,w*.56*pct,4)}
function update(dt){if(paused)return;t+=dt/1000;let all=true;balls.forEach((b,i)=>{if(b.done)return;all=false;b.vy+=.00055*dt;b.x+=b.vx*dt*.06;b.y+=b.vy*dt*.06;if(b.y+b.r>py-5){b.y=py-5-b.r;b.vy=-Math.max(1.6,Math.abs(b.vy)*.68);b.vx+=(Math.random()-.5)*.2;if(Math.random()<.12)beep(130+Math.random()*100,.04)}if(t>2.3){let q=target(i),dx=q.x-b.x,dy=q.y-b.y;b.vx+=dx*.00008*dt;b.vy+=dy*.00008*dt;if(Math.hypot(dx,dy)<b.r*1.8){b.done=true;joined++;beep(400+Math.random()*350,.12);for(let k=0;k<3;k++)sparks.push({x:b.x,y:b.y,life:25,color:b.color})}}if(b.x<b.r||b.x>w-b.r)b.vx*=-.8});sparks.forEach(a=>a.life--);sparks=sparks.filter(a=>a.life>0);if(all&&balls.length){document.getElementById('msg').textContent='Shape complete!';if(t>8)reset(true)}}
function loop(now){let dt=Math.min(32,now-last||16);last=now;update(dt);draw();requestAnimationFrame(loop)}
document.getElementById('new').onclick=()=>{reset(true);beep(520)};document.getElementById('snd').onclick=()=>{sound=!sound;document.getElementById('snd').textContent=sound?'♪ SOUND ON':'♪ SOUND OFF';if(sound)beep(520)};document.getElementById('pause').onclick=()=>{paused=!paused;document.getElementById('pause').textContent=paused?'▶ RESUME':'Ⅱ PAUSE'};addEventListener('resize',size);size();requestAnimationFrame(loop)})();
</script></body></html>
